<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panda Assistant</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075E54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="https://apxid.github.io/assistant/assets/panda.png">

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

/* ANIMASI */
@keyframes slideUp{
    from{transform:translateY(100%);opacity:0}
    to{transform:translateY(0);opacity:1}
}

@keyframes tvOff{
    0%{transform:scale(1,1);opacity:1;filter:brightness(1)}
    50%{transform:scale(1,.05);filter:brightness(5)}
    100%{transform:scale(.01,0);opacity:0;filter:brightness(0)}
}

/* IKON PANDA */
#panda-icon{
    position:fixed;
    right:20px;
    bottom:20px;
    width:70px;
    height:70px;
    cursor:pointer;
    z-index:999999;
    display:block;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

#panda-icon img{
    width:70px;
    height:auto;
    display:block;
    transition:transform .2s ease;
}

#panda-icon img:hover{transform:scale(1.1)}

/* CHAT WIDGET */
#panda-chat{
    position:fixed;
    right:20px;
    bottom:20px;
    width:360px;
    height:560px;
    max-width:calc(100vw - 40px);
    max-height:calc(100dvh - 40px);
    background:#fff;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:999999;
    will-change:transform,opacity;
}

#panda-chat.open{
    animation:slideUp .6s cubic-bezier(.16,1,.3,1) forwards;
}

#panda-chat.closing{
    animation:tvOff .5s cubic-bezier(.55,.055,.675,.19) forwards;
}

.hidden{display:none!important}

/* HEADER */
.header{
    flex-shrink:0;
    height:60px;
    padding:10px 15px;
    background:#075E54;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-left{
    display:flex;
    align-items:center;
    min-width:0;
}

.header-logo{
    width:40px;
    height:40px;
    object-fit:contain;
    margin-right:10px;
    flex-shrink:0;
}

#app-name{
    font-weight:600;
    font-size:15px;
    letter-spacing:.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#close-btn{
    background:none;
    border:none;
    color:#fff;
    font-size:27px;
    line-height:1;
    cursor:pointer;
    padding:0 2px;
    flex-shrink:0;
}

/* CHAT BODY */
#chat-body{
    flex:1;
    min-height:0;
    padding:15px;
    overflow-y:auto;
    background-image:url('https://apxid.github.io/assistant/assets/bg.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    flex-direction:column;
    -webkit-overflow-scrolling:touch;
}

/* BUBBLE */
.bubble{
    padding:10px 14px;
    margin:8px 15px;
    border-radius:15px;
    max-width:80%;
    font-size:14.5px;
    line-height:1.4;
    position:relative;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    display:flex;
    flex-direction:column;
}

.bubble::after{
    content:"";
    position:absolute;
    bottom:0;
    width:15px;
    height:15px;
}

.panda{
    background:#fff;
    align-self:flex-start;
    border-bottom-left-radius:0;
    color:#303030;
}

.panda::after{
    left:-7px;
    background:#fff;
    clip-path:polygon(0 100%,100% 100%,100% 0);
}

.user{
    background:#dcf8c6;
    align-self:flex-end;
    border-bottom-right-radius:0;
    color:#303030;
}

.user::after{
    right:-7px;
    background:#dcf8c6;
    clip-path:polygon(0 100%,100% 100%,0 0);
}

/* WAKTU + CENTANG */
.meta-container{
    display:flex;
    align-items:center;
    align-self:flex-end;
    margin-top:4px;
    margin-bottom:-4px;
    margin-right:-4px;
    gap:3px;
    user-select:none;
}

.chat-time{
    font-size:10px;
    color:#808080;
}

.ticks{
    font-size:11px;
    line-height:1;
    font-weight:bold;
}

.ticks.sent{color:#8696a0}
.ticks.read{color:#53bdeb}

/* INPUT */
#input-area{
    flex-shrink:0;
    padding:10px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:#f0f0f0;
    border-top:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:5px;
}

#user-input{
    flex:1;
    min-width:0;
    padding:10px 15px;
    border-radius:20px;
    border:1px solid #ddd;
    outline:none;
    font-size:16px;
    font-family:inherit;
    background:#fff;
}

#user-input:focus{border-color:#075E54}

#send-btn{
    width:42px;
    height:42px;
    background:none;
    border:none;
    color:#075E54;
    font-size:24px;
    cursor:pointer;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

#send-btn:active{transform:scale(.9)}

@media(max-width:600px){
    #panda-icon{right:15px;bottom:15px}

    #panda-chat{
        right:10px;
        bottom:10px;
        width:calc(100vw - 20px);
        height:calc(100dvh - 20px);
        max-width:none;
        max-height:none;
        border-radius:20px;
    }
}

@media(max-height:600px){
    #panda-chat{height:calc(100dvh - 20px)}
}
</style>
</head>

<body>

<audio id="sound-open" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>
<audio id="sound-close" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<div id="panda-icon" onclick="openChat()">
    <img src="https://apxid.github.io/assistant/assets/mypanda.gif" alt="Panda Assistant">
</div>

<div id="panda-chat" class="hidden">

    <div class="header">
        <div class="header-left">
            <img
                src="https://apxid.github.io/assistant/assets/panda.png"
                class="header-logo"
                alt="Panda">
            <span id="app-name">PANDA ASSISTANT</span>
        </div>

        <button id="close-btn" onclick="closeChat()" aria-label="Tutup">×</button>
    </div>

    <div id="chat-body"></div>

    <div id="input-area">
        <input
            type="text"
            id="user-input"
            placeholder="Ketik pesan..."
            autocomplete="off"
            onkeydown="if(event.key==='Enter') sendMessage()">

        <button
            id="send-btn"
            onclick="sendMessage()"
            aria-label="Kirim">➤</button>
    </div>
</div>

<script>
/* =========================================================
   URL GAS — mengikuti index.html utama
========================================================= */
const GAS_URL =
"https://script.google.com/macros/s/AKfycbzMe6SvN_qVVUG48vkCoMphQINZRV3BU_7nEz8cyO13Y5a5iC7xRQD9eH1lFRGwsi8ZNw/exec";

let isWaitingForName = false;
let lastUserMessageElement = null;
let typeTimer = null;

/* =========================================================
   SESSION ID
========================================================= */
let sessionId = localStorage.getItem("panda_session_id");

if(!sessionId){
    sessionId =
        "sess_" +
        Math.random().toString(36).substring(2,15) +
        Date.now().toString(36);

    localStorage.setItem("panda_session_id",sessionId);
}

/* =========================================================
   SERVICE WORKER
========================================================= */
if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
        navigator.serviceWorker
            .register("sw.js")
            .catch(function(err){
                console.log("SW error:",err);
            });
    });
}

/* =========================================================
   WAKTU
========================================================= */
function getFormattedTime(){
    const now = new Date();

    return (
        String(now.getHours()).padStart(2,"0") +
        ":" +
        String(now.getMinutes()).padStart(2,"0")
    );
}

/* =========================================================
   TYPEWRITER HEADER
========================================================= */
function startTypewriter(){

    const el = document.getElementById("app-name");
    const text = "PANDA ASSISTANT   ";
    let i = 0;

    clearTimeout(typeTimer);

    function type(){
        el.innerText = text.substring(0,i);
        i = (i + 1) % (text.length + 1);
        typeTimer = setTimeout(type,150);
    }

    type();
}

/* =========================================================
   OPEN CHAT
========================================================= */
function openChat(){

    const sound = document.getElementById("sound-open");

    if(sound){
        sound.currentTime = 0;
        sound.play().catch(function(){});
    }

    document.getElementById("panda-icon").style.display = "none";

    const chat = document.getElementById("panda-chat");

    chat.classList.remove("hidden","closing");
    chat.classList.add("open");

    startTypewriter();

    if(document.getElementById("chat-body").innerHTML === ""){

        const savedName =
            localStorage.getItem("panda_user");

        if(savedName){

            addMessage(
                `Halo kembali ${savedName}! Ada yang bisa saya bantu?`,
                "panda"
            );

            isWaitingForName = false;

        }else{

            addMessage(
                "Halo! Saya Panda. Siapa nama kamu?",
                "panda"
            );

            isWaitingForName = true;
        }
    }

    setTimeout(function(){
        document.getElementById("user-input").focus();
    },300);
}

/* =========================================================
   CLOSE CHAT
========================================================= */
function closeChat(){

    const sound = document.getElementById("sound-close");

    if(sound){
        sound.currentTime = 0;
        sound.play().catch(function(){});
    }

    clearTimeout(typeTimer);

    const chat = document.getElementById("panda-chat");

    chat.classList.remove("open");
    chat.classList.add("closing");

    setTimeout(function(){

        chat.classList.add("hidden");

        document.getElementById("panda-icon").style.display = "block";

    },500);
}

/* =========================================================
   CLEAR CHAT
========================================================= */
function clearChat(){

    const body = document.getElementById("chat-body");

    body.innerHTML = "";

    lastUserMessageElement = null;
    isWaitingForName = false;

    const savedName =
        localStorage.getItem("panda_user");

    if(savedName){

        addMessage(
            `Halo kembali ${savedName}! Ada yang bisa saya bantu?`,
            "panda"
        );

    }else{

        addMessage(
            "Halo! Saya Panda. Siapa nama kamu?",
            "panda"
        );

        isWaitingForName = true;
    }

    document.getElementById("user-input").focus();
}

/* =========================================================
   ABOUT
========================================================= */
function showAbout(answer){

    addMessage(
        answer ||
        "PANDA ASSISTANT 🐼\nVersi 1.0\nDeveloped by MB © 2026",
        "panda"
    );
}

/* =========================================================
   HELP
========================================================= */
function showHelp(answer){

    addMessage(
        answer ||
        "Berikut command yang tersedia:\n/cls • /about • /exit • /help",
        "panda"
    );
}

/* =========================================================
   COMMAND
========================================================= */
function executeCommand(data){

    const action =
        String(data.action || "")
        .trim()
        .toUpperCase();

    if(action === "CLS"){
        clearChat();
        return;
    }

    if(action === "ABOUT"){
        showAbout(data.answer);
        return;
    }

    if(action === "HELP"){
        showHelp(data.answer);
        return;
    }

    if(action === "EXIT"){

        if(data.answer){
            addMessage(data.answer,"panda");
        }

        setTimeout(function(){
            closeChat();
        },500);

        return;
    }

    if(data.answer){
        addMessage(data.answer,"panda");
    }
}

/* =========================================================
   ADD MESSAGE
========================================================= */
function addMessage(text,sender){

    const body = document.getElementById("chat-body");

    const div = document.createElement("div");
    div.className = "bubble " + sender;

    const textSpan = document.createElement("span");

    textSpan.innerText = text || "";
    textSpan.style.whiteSpace = "pre-wrap";

    div.appendChild(textSpan);

    const metaContainer =
        document.createElement("div");

    metaContainer.className =
        "meta-container";

    const timeSpan =
        document.createElement("span");

    timeSpan.className = "chat-time";
    timeSpan.innerText = getFormattedTime();

    metaContainer.appendChild(timeSpan);

    if(sender === "user"){

        const ticksSpan =
            document.createElement("span");

        ticksSpan.className = "ticks sent";
        ticksSpan.innerHTML = "&#10004;&#10004;";

        metaContainer.appendChild(ticksSpan);

        lastUserMessageElement = ticksSpan;
    }

    div.appendChild(metaContainer);

    body.appendChild(div);

    body.scrollTop = body.scrollHeight;
}

/* =========================================================
   JSONP REQUEST
========================================================= */
function requestPanda(question,userName,currentSessionId){

    return new Promise(function(resolve,reject){

        const callbackName =
            "pandaCallback_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8);

        const script =
            document.createElement("script");

        let finished = false;

        const cleanup = function(){

            finished = true;

            if(script.parentNode){
                script.parentNode.removeChild(script);
            }

            try{
                delete window[callbackName];
            }catch(e){
                window[callbackName] = undefined;
            }
        };

        const timer =
            setTimeout(function(){

                if(finished) return;

                cleanup();

                reject(
                    new Error(
                        "Server Panda tidak merespons dalam 20 detik."
                    )
                );

            },20000);

        window[callbackName] =
            function(data){

                if(finished) return;

                clearTimeout(timer);
                cleanup();

                resolve(data);
            };

        script.onerror =
            function(){

                if(finished) return;

                clearTimeout(timer);
                cleanup();

                reject(
                    new Error(
                        "Tidak dapat menghubungi server Panda."
                    )
                );
            };

        const params =
            new URLSearchParams();

        params.set("question",question || "");
        params.set("userName",userName || "Pengunjung");
        params.set("sessionId",currentSessionId || "");
        params.set("callback",callbackName);
        params.set("_",Date.now().toString());

        script.src =
            GAS_URL +
            (GAS_URL.includes("?") ? "&" : "?") +
            params.toString();

        script.async = true;

        document.head.appendChild(script);
    });
}

/* =========================================================
   SEND MESSAGE
========================================================= */
async function sendMessage(){

    const input =
        document.getElementById("user-input");

    const val = input.value.trim();

    if(!val) return;

    addMessage(val,"user");

    input.value = "";

    const currentSessionId =
        localStorage.getItem("panda_session_id") ||
        sessionId;

    /* INPUT NAMA */
    if(isWaitingForName){

        localStorage.setItem(
            "panda_user",
            val
        );

        isWaitingForName = false;

        if(lastUserMessageElement){
            lastUserMessageElement.className =
                "ticks read";
        }

        try{

            await requestPanda(
                "perkenalan_nama",
                val,
                currentSessionId
            );

        }catch(e){

            console.warn(
                "Sinkronisasi nama gagal:",
                e
            );
        }

        addMessage(
            `Halo ${val}! Apa yang ingin ditanyakan?`,
            "panda"
        );

        return;
    }

    /* TYPING */
    const typing =
        document.createElement("div");

    typing.className = "bubble panda";
    typing.innerHTML =
        "<i>Panda sedang mengetik...</i>";

    const body =
        document.getElementById("chat-body");

    body.appendChild(typing);
    body.scrollTop = body.scrollHeight;

    const currentTicks =
        lastUserMessageElement;

    try{

        const currentUserName =
            localStorage.getItem("panda_user") ||
            "Pengunjung";

        const data =
            await requestPanda(
                val,
                currentUserName,
                currentSessionId
            );

        typing.remove();

        if(currentTicks){
            currentTicks.className =
                "ticks read";
        }

        if(!data || typeof data !== "object"){
            throw new Error(
                "Response server tidak valid."
            );
        }

        if(data.command === true){

            executeCommand(data);
            return;
        }

        addMessage(
            data.answer ||
            "Maaf, Panda belum tahu jawabannya.",
            "panda"
        );

    }catch(err){

        typing.remove();

        if(currentTicks){
            currentTicks.className =
                "ticks sent";
        }

        addMessage(
            "Maaf, koneksi ke Panda gagal. Coba kirim ulang.",
            "panda"
        );

        console.error(
            "PANDA ERROR:",
            err
        );
    }
}
</script>

</body>
</html>
